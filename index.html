d-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow)}.stat .label{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:24px;margin:12px 0 5px}.stat small{font-size:11px;color:var(--muted)}.stat .symbol{float:left;background:var(--mint);color:var(--teal);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;font-size:17px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.panel h2{font-size:16px;margin:0}.panel-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-weight:600;background:#fafcfc}tbody tr:last-child td{border-bottom:0}.tag{padding:5px 9px;border-radius:20px;font-size:10px;background:#edf2f4;color:#60727a;display:inline-block}.tag.green{background:#e7f6ee;color:#21845e}.tag.orange{background:#fff4df;color:#a56b14}.tag.blue{background:#e8f2f8;color:#36728f}.tag.red{background:#fff0f0;color:#b84949}.actions{display:flex;gap:5px}.mini{border:1px solid var(--line);background:white;border-radius:7px;padding:6px 9px;font-size:11px;color:var(--ink)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;min-width:0;color:var(--ink);width:100%;outline:none}.toolbar input{max-width:280px}.field{display:grid;gap:7px}.field label{font-size:12px;color:#52666e;font-weight:700}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.form-grid .wide{grid-column:1/-1}.empty{text-align:center;color:var(--muted);padding:30px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#071c24a6;display:grid;place-items:center;padding:18px;z-index:20}.modal-box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0;font-size:18px}.close{border:0;background:#f0f4f5;border-radius:8px;width:32px;height:32px;font-size:19px}.modal-actions{display:flex;justify-content:flex-start;gap:8px;margin-top:18px}.notice{background:#fff8e8;border:1px solid #f2e2bd;padding:12px;border-radius:10px;color:#7d5c1c;font-size:12px;line-height:1.8}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.quick button{background:#f7fafb;border:1px solid var(--line);border-radius:10px;padding:14px;text-align:right;color:var(--ink)}.quick b{display:block;margin-bottom:5px}.quick span{font-size:11px;color:var(--muted)}.report-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.report-number{font-size:23px;font-weight:700;margin-top:10px}.bar{height:8px;background:#edf2f4;border-radius:20px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--teal);border-radius:20px}.mobile-head{display:none}

<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">✦</div><div><b>FULL CLEAN</b><small>نظام إدارة المغسلة</small></div></div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>الرئيسية</button><button data-page="orders"><span class="ico">▤</span>الطلبات</button><button data-page="customers"><span class="ico">♙</span>العملاء</button><button data-page="expenses"><span class="ico">↗</span>المصروفات</button><button data-page="services"><span class="ico">♧</span>الخدمات</button><button data-page="staff"><span class="ico">♧</span>الموظفون</button><button data-page="reports"><span class="ico">▥</span>التقارير</button><button data-page="settings"><span class="ico">⚙</span>الإعدادات</button></nav><div class="side-foot">FULL CLEAN LAUNDRY<br>إدارة أسهل.. خدمة أفضل</div></aside>
<main class="main"><header class="top"><div><h1 id="pageTitle">لوحة التحكم</h1><p id="today"></p></div><div class="top-actions"><span class="user-pill" id="roleLabel">مدير النظام</span><button class="btn primary" onclick="openOrder()">＋ طلب جديد</button></div></header><section id="content"></section></main></div>

<script>
// إعدادات ربط مغاسل فل كلين مع Supabase
const SUPABASE_URL='https://xcveuwqcwktbusvxjofw.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_cK8K16fE-oktSQOTdlKXsQ_Acpsprgs';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const KEY='fullclean_settings_v2';
let db={services:[],customers:[],orders:[],expenses:[],staff:[],settings:{shop:'مغاسل فل كلين',phone:'',address:'عدن - المنصورة - خط التسعين خلف مدرسة رواد المستقبل',currency:'ريال يمني'}};
let page='dashboard', role='employee', currentUser=null, profile=null, busy=false;
const money=n=>(Number(n)||0).toLocaleString('en-US')+' ر.ي';
const today=()=>{let d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uuid=()=>crypto.randomUUID();
const statusText={received:'تم الاستلام',washing:'قيد الغسيل',ironing:'قيد الكي',ready:'جاهز',delivered:'تم التسليم'};
const statusClass={received:'blue',washing:'orange',ironing:'orange',ready:'green',delivered:''};
function due(o){return Math.max(0,Number(o.total)-Number(o.paid))}
function sumOrders(a){return a.reduce((s,o)=>s+Number(o.total||0),0)}
function localSettings(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');db.settings={...db.settings,...x}}catch(e){}}
function saveSettingsLocal(){localStorage.setItem(KEY,JSON.stringify(db.settings))}
function notifyError(e){console.error(e);alert('تعذر تنفيذ العملية: '+(e?.message||'تحقق من الاتصال والصلاحيات'))}
function showLogin(message=''){
 document.querySelector('.app').style.display='none';document.getElementById('modal').classList.add('hidden');
 let el=document.getElementById('loginScreen');if(!el){el=document.createElement('div');el.id='loginScreen';el.style.cssText='min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg)';document.body.appendChild(el)}
 el.innerHTML=`<div style="width:min(430px,100%);background:white;padding:26px;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)"><div style="text-align:center;font-size:38px;color:var(--teal)">✦</div><h2 style="text-align:center;margin:8px 0">مغاسل فل كلين</h2><p style="text-align:center;color:var(--muted);font-size:13px">تسجيل الدخول إلى النظام المركزي</p>${message?`<div class="notice">${esc(message)}</div>`:''}<form id="loginForm"><div class="field" style="margin:14px 0"><label>البريد الإلكتروني</label><input name="email" type="email" required autocomplete="username" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:18px">دخول</button></form><p style="font-size:11px;color:var(--muted);line-height:1.8">استخدم البريد وكلمة المرور للمستخدم الذي أضفته في Supabase. لا تشارك كلمة المرور مع أي شخص.</p></div>`;
 el.style.display='grid';document.getElementById('loginForm').onsubmit=login;
}
async function login(e){e.preventDefault();let f=new FormData(e.target);let b=e.target.querySelector('button');b.disabled=true;b.textContent='جارٍ تسجيل الدخول...';try{let {data,error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;await startApp(data.user)}catch(err){showLogin('تعذر تسجيل الدخول: '+err.message)} }
async function logout(){await sb.auth.signOut();currentUser=null;profile=null;showLogin('تم تسجيل الخروج')}
async function startApp(user){currentUser=user;let {data:p,error}=await sb.from('profiles').select('id,full_name,role').eq('id',user.id).maybeSingle();if(error)throw error;if(!p){await sb.auth.signOut();showLogin('حسابك لا يحتوي على ملف مستخدم في profiles. أضف ملف المستخدم من لوحة Supabase ثم حاول مجدداً.');return}profile=p;role=p.role||'employee';document.querySelector('.app').style.display='flex';let l=document.getElementById('loginScreen');if(l)l.remove();document.getElementById('roleLabel').textContent=(p.full_name||user.email)+' · '+(role==='manager'?'مدير':'موظف');localSettings();await refreshData();if(role==='manager'&&db.services.length===0){let defaults=[['غسيل وكوي',1500],['كوي فقط',700],['تنظيف جاف',2500],['غسيل بطانية',3000],['غسيل مفروشات',4000]];let {error}=await sb.from('services').insert(defaults.map(([name,price])=>({id:uuid(),name,price,active:true})));if(error)console.warn('لم تتم إضافة الخدمات الافتراضية:',error.message);else await refreshData()}render();}
async function refreshData(){if(!currentUser)return;try{
 const [sv,cu,oo,ii,pp,ee]=await Promise.all([
  sb.from('services').select('*').order('name'),sb.from('customers').select('*').order('created_at',{ascending:false}),sb.from('orders').select('*').order('created_at',{ascending:false}),sb.from('order_items').select('*'),sb.from('payments').select('*'),sb.from('expenses').select('*').order('expense_date',{ascending:false})
 ]);
 for(let r of [sv,cu,oo,ii,pp,ee])if(r.error)throw r.error;
 db.services=(sv.data||[]).map(x=>({id:x.id,name:x.name,price:Number(x.price)||0,active:x.active}));
 db.customers=(cu.data||[]).map(x=>({id:x.id,name:x.name,phone:x.phone||'',address:x.address||'',notes:x.notes||''}));
 let itemMap={};(ii.data||[]).forEach(x=>(itemMap[x.order_id]??=[]).push({id:x.id,serviceId:x.service_id,garment:x.item_name,qty:Number(x.quantity),price:Number(x.unit_price),total:Number(x.subtotal),service:db.services.find(s=>s.id===x.service_id)?.name||''}));
 let paidMap={};(pp.data||[]).forEach(x=>paidMap[x.order_id]=(paidMap[x.order_id]||0)+Number(x.amount||0));
 db.orders=(oo.data||[]).map(x=>{let c=db.customers.find(c=>c.id===x.customer_id);let items=itemMap[x.id]||[];return {id:x.id,no:String(x.order_number),customerId:x.customer_id,customer:c?.name||'عميل غير معروف',phone:c?.phone||'',date:(x.created_at||'').slice(0,10),items,service:items.map(i=>i.service).join('، '),garment:items.map(i=>`${i.garment} (${i.qty})`).join('، '),qty:items.reduce((a,i)=>a+i.qty,0),total:Number(x.total_amount)||0,paid:paidMap[x.id]||0,status:x.status||'received',note:x.notes||'',created:new Date(x.created_at||Date.now()).getTime()}});
 db.expenses=(ee.data||[]).map(x=>({id:x.id,category:x.category||'أخرى',amount:Number(x.amount)||0,date:x.expense_date,note:x.description||'',by:x.created_by===currentUser.id?(profile.full_name||'المستخدم'):'مستخدم'}));
 }catch(err){notifyError(err);throw err}}
function pageHead(t){document.getElementById('pageTitle').textContent=t}
function render(){if(!currentUser)return;const c=document.getElementById('content');
 if(page==='dashboard'){pageHead('لوحة التحكم');let todays=db.orders.filter(o=>o.date===today()),revenue=todays.reduce((s,o)=>s+o.paid,0),ready=db.orders.filter(o=>o.status==='ready').length,owed=db.orders.reduce((s,o)=>s+due(o),0);c.innerHTML=`<div class="cards"><div class="stat"><span class="symbol">ر</span><div class="label">تحصيل اليوم</div><strong>${money(revenue)}</strong><small>المبالغ المحصلة اليوم</small></div><div class="stat"><span class="symbol">▤</span><div class="label">طلبات اليوم</div><strong>${todays.length}</strong><small>إجمالي الطلبات اليوم</small></div><div class="stat"><span class="symbol">✓</span><div class="label">طلبات جاهزة</div><strong>${ready}</strong><small>بانتظار التسليم</small></div><div class="stat"><span class="symbol">◷</span><div class="label">مستحقات العملاء</div><strong>${money(owed)}</strong><small>المتبقي على الطلبات</small></div></div><div class="panel"><div class="panel-head"><div><h2>إجراءات سريعة</h2><p>البيانات تحفظ مركزياً وتظهر على الأجهزة الأخرى عند تسجيل الدخول</p></div></div><div class="quick"><button onclick="openOrder()"><b>＋ تسجيل طلب جديد</b><span>إضافة أصناف وفاتورة</span></button><button onclick="openExpense()"><b>↗ تسجيل مصروف</b><span>إدخال المصروفات</span></button><button onclick="go('orders')"><b>▤ متابعة الطلبات</b><span>متابعة حالات الطلبات</span></button></div></div><div class="panel"><div class="panel-head"><div><h2>أحدث الطلبات</h2></div><button class="btn light" onclick="go('orders')">عرض الكل</button></div>${ordersTable([...db.orders].slice(0,7))}</div>`}
 else if(page==='orders'){pageHead('إدارة الطلبات');c.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>سجل الطلبات</h2><p>الطلبات والأصناف والمدفوعات</p></div><button class="btn primary" onclick="openOrder()">＋ طلب جديد</button></div><div class="toolbar"><input id="orderSearch" placeholder="بحث برقم الطلب أو اسم العميل أو الهاتف" oninput="filterOrders()"><select id="statusFilter" onchange="filterOrders()"><option value="">كل الحالات</option>${Object.entries(statusText).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div id="ordersTable">${ordersTable(db.orders)}</div></div>`}
 else if(page==='customers'){pageHead('العملاء');c.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>قاعدة بيانات العملاء</h2></div><button class="btn primary" onclick="openCustomer()">＋ عميل جديد</button></div><div class="toolbar"><input id="customerSearch" placeholder="ابحث بالاسم أو الهاتف" oninput="filterCustomers()"></div><div id="customersTable">${customersTable(db.customers)}</div></div>`}
 else if(page==='expenses'){pageHead('المصروفات');c.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>سجل المصروفات</h2><p>متاح للمستخدمين المسجلين حسب الصلاحية التي ضبطتها</p></div><button class="btn primary" onclick="openExpense()">＋ مصروف جديد</button></div><div class="toolbar"><input type="date" id="expFrom" onchange="filterExpenses()"><input type="date" id="expTo" onchange="filterExpenses()"></div><div id="expensesTable">${expensesTable(db.expenses)}</div></div>`}
 else if(page==='services'){pageHead('الخدمات والأسعار');c.innerHTML=`<div class="panel"><div class="panel-head"><div><h2>قائمة الخدمات</h2><p>${role==='manager'?'يمكن للمدير تعديل الأسعار':'عرض الخدمات والأسعار فقط'}</p></div>${role==='manager'?'<button class="btn primary" onclick="openService()">＋ خدمة جديدة</button>':''}</div>${servicesTable()}</div>`}
 else if(page==='staff'){pageHead('الموظفون');c.innerHTML=`<div class="panel"><h2>حسابات الموظفين</h2><p class="muted" style="line-height:2">لإضافة موظف جديد: من لوحة Supabase افتح Authentication ثم Users ثم Add user، وأنشئ له بريداً وكلمة مرور. يجب إنشاء سجل له في جدول profiles بدور employee. لا يتم حفظ كلمات المرور داخل التطبيق.</p><div class="notice">حساب المدير الحالي: ${esc(profile?.full_name||currentUser.email)}. يمكنك استخدام حسابات منفصلة لكل موظف.</div></div>`}
 else if(page==='reports'){pageHead('التقارير');let rev=sumOrders(db.orders),col=db.orders.reduce((s,o)=>s+o.paid,0),exp=db.expenses.reduce((s,x)=>s+x.amount,0),receiv=db.orders.reduce((s,o)=>s+due(o),0);c.innerHTML=`<div class="report-grid"><div class="panel"><div class="label">إجمالي الطلبات</div><div class="report-number">${money(rev)}</div></div><div class="panel"><div class="label">إجمالي التحصيل</div><div class="report-number">${money(col)}</div></div><div class="panel"><div class="label">إجمالي المصروفات</div><div class="report-number">${money(exp)}</div></div><div class="panel"><div class="label">المبالغ المستحقة</div><div class="report-number">${money(receiv)}</div></div></div><div class="panel"><h2>صافي التحصيل النقدي بعد المصروفات</h2><div class="report-number">${money(col-exp)}</div><button class="btn light" onclick="exportData()">تصدير CSV</button></div>`}
 else if(page==='settings'){pageHead('الإعدادات');c.innerHTML=`<div class="panel"><h2>بيانات المغسلة</h2><form onsubmit="saveSettings(event)"><div class="form-grid"><div class="field"><label>اسم المغسلة</label><input name="shop" value="${esc(db.settings.shop)}"></div><div class="field"><label>الهاتف</label><input name="phone" value="${esc(db.settings.phone)}"></div><div class="field wide"><label>العنوان</label><input name="address" value="${esc(db.settings.address)}"></div></div><div class="modal-actions"><button class="btn primary">حفظ الإعدادات على هذا الجهاز</button><button type="button" class="btn light" onclick="refreshData().then(render)">تحديث البيانات</button><button type="button" class="btn danger" onclick="logout()">تسجيل الخروج</button></div></form></div>`}
 document.getElementById('today').textContent=new Intl.DateTimeFormat('ar-YE',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(new Date());}

function ordersTable(a){if(!a.length)return '<div class="empty">لا توجد طلبات مسجلة</div>';return `<div class="table-wrap"><table><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الأصناف</th><th>التاريخ</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${a.map(o=>`<tr><td>#${esc(o.no)}</td><td>${esc(o.customer)}</td><td>${esc(o.garment||'—')}</td><td>${o.date}</td><td>${money(o.total)}</td><td>${money(o.paid)}</td><td>${money(due(o))}</td><td><span class="tag ${statusClass[o.status]||''}">${statusText[o.status]||o.status}</span></td><td><div class="actions"><button class="mini" onclick="printOrder('${o.id}')">طباعة</button><button class="mini" onclick="changeStatus('${o.id}')">الحالة</button></div></td></tr>`).join('')}</tbody></table></div>`}
function customersTable(a){if(!a.length)return '<div class="empty">لا يوجد عملاء</div>';return `<div class="table-wrap"><table><thead><tr><th>الاسم</th><th>الهاتف</th><th>العنوان</th><th>عدد الطلبات</th><th>المتبقي</th></tr></thead><tbody>${a.map(x=>{let os=db.orders.filter(o=>o.customerId===x.id);return `<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.address||'—')}</td><td>${os.length}</td><td>${money(os.reduce((s,o)=>s+due(o),0))}</td></tr>`}).join('')}</tbody></table></div>`}
function expensesTable(a){if(!a.length)return '<div class="empty">لا توجد مصروفات</div>';return `<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>البند</th><th>البيان</th><th>المبلغ</th><th>المسؤول</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.date}</td><td>${esc(x.category)}</td><td>${esc(x.note||'—')}</td><td>${money(x.amount)}</td><td>${esc(x.by||'—')}</td></tr>`).join('')}</tbody></table></div>`}
function servicesTable(){return `<div class="table-wrap"><table><thead><tr><th>الخدمة</th><th>السعر الافتراضي</th>${role==='manager'?'<th>إجراء</th>':''}</tr></thead><tbody>${db.services.map(s=>`<tr><td>${esc(s.name)}</td><td>${money(s.price)}</td>${role==='manager'?`<td><button class="mini" onclick="openService('${s.id}')">تعديل</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function filterOrders(){let q=document.getElementById('orderSearch').value.toLowerCase(),st=document.getElementById('statusFilter').value;let a=db.orders.filter(o=>(!st||o.status===st)&&(`${o.no} ${o.customer} ${o.phone}`).toLowerCase().includes(q));document.getElementById('ordersTable').innerHTML=ordersTable(a)}
function filterCustomers(){let q=document.getElementById('customerSearch').value.toLowerCase();document.getElementById('customersTable').innerHTML=customersTable(db.customers.filter(x=>(x.name+' '+x.phone).toLowerCase().includes(q)))}
function filterExpenses(){let a=db.expenses,from=document.getElementById('expFrom').value,to=document.getElementById('expTo').value;document.getElementById('expensesTable').innerHTML=expensesTable(a.filter(x=>(!from||x.date>=from)&&(!to||x.date<=to)))}
function showModal(t,h){document.getElementById('modalTitle').textContent=t;document.getElementById('modalBody').innerHTML=h;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function openOrder(){if(!db.services.length){alert('أضف خدمة واحدة على الأقل أولاً');return}let opts=db.customers.map(x=>`<option value="${x.id}">${esc(x.name)} – ${esc(x.phone)}</option>`).join('');showModal('تسجيل طلب جديد',`<form onsubmit="saveOrder(event)"><div class="form-grid"><div class="field"><label>العميل المسجل (اختياري)</label><select name="customerId"><option value="">عميل جديد / اختر</option>${opts}</select></div><div class="field"><label>اسم العميل</label><input name="customer" required></div><div class="field"><label>رقم الهاتف</label><input name="phone"></div><div class="field"><label>موعد التسليم</label><input name="dueDate" type="date"></div><div class="field wide"><label>الأصناف</label><div id="orderItems"></div><button type="button" class="btn light" onclick="addOrderItem()">＋ إضافة صنف</button></div><div class="field"><label>الخصم</label><input name="discount" type="number" min="0" value="0" oninput="calcOrderItems()"></div><div class="field"><label>المبلغ المدفوع</label><input name="paid" type="number" min="0" value="0" required></div><div class="field"><label>الحالة</label><select name="status">${Object.entries(statusText).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="field wide"><label>ملاحظات</label><textarea name="note"></textarea></div></div><div style="margin-top:12px;font-weight:bold">الإجمالي: <span id="orderGrandTotal">0 ر.ي</span></div><div class="modal-actions"><button class="btn primary">حفظ وإصدار الفاتورة</button></div></form>`);addOrderItem()}
function addOrderItem(){let box=document.getElementById('orderItems');if(!box)return;let row=document.createElement('div');row.className='order-item';row.style.cssText='display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px;margin:8px 0';row.innerHTML=`<div class="field"><label>الخدمة</label><select class="item-service" onchange="itemServiceChanged(this)">${db.services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>الصنف</label><input class="item-garment" placeholder="قميص، بنطال..." required></div><div class="field"><label>الكمية</label><input class="item-qty" type="number" min="1" value="1" oninput="calcOrderItems()" required></div><div class="field"><label>سعر الوحدة</label><input class="item-price" type="number" min="0" value="${db.services[0]?.price||0}" oninput="calcOrderItems()" required></div><div class="field"><label>الإجمالي</label><input class="item-total" readonly value="0"></div><div><button type="button" class="btn danger" onclick="this.closest('.order-item').remove();calcOrderItems()">حذف</button></div>`;box.appendChild(row);calcOrderItems()}
function itemServiceChanged(sel){let s=db.services.find(x=>x.id===sel.value);sel.closest('.order-item').querySelector('.item-price').value=s?.price||0;calcOrderItems()}
function calcOrderItems(){let box=document.getElementById('orderItems');if(!box)return;let total=0;box.querySelectorAll('.order-item').forEach(r=>{let v=(Number(r.querySelector('.item-qty').value)||0)*(Number(r.querySelector('.item-price').value)||0);r.querySelector('.item-total').value=v;total+=v});let discount=Number(document.querySelector('#modalBody [name="discount"]')?.value)||0;document.getElementById('orderGrandTotal').textContent=money(Math.max(0,total-discount))}
async function saveOrder(e){e.preventDefault();if(busy)return;busy=true;let btn=e.target.querySelector('button[type="submit"]');if(btn)btn.disabled=true;try{let f=new FormData(e.target),name=String(f.get('customer')||'').trim(),phone=String(f.get('phone')||'').trim(),cid=f.get('customerId')||null;let cust=cid?db.customers.find(x=>x.id===cid):null;if(!cust){let {data,error}=await sb.from('customers').insert({id:uuid(),name,phone,address:''}).select().single();if(error)throw error;cust={...data}}
 let items=[...document.querySelectorAll('#orderItems .order-item')].map(r=>({serviceId:r.querySelector('.item-service').value,garment:r.querySelector('.item-garment').value.trim(),qty:Number(r.querySelector('.item-qty').value),price:Number(r.querySelector('.item-price').value)}));if(!items.length||items.some(x=>!x.garment||x.qty<1||x.price<0))throw new Error('أكمل بيانات الأصناف');let discount=Number(f.get('discount'))||0,total=Math.max(0,items.reduce((a,x)=>a+x.qty*x.price,0)-discount),paid=Number(f.get('paid'))||0;if(paid>total)throw new Error('المبلغ المدفوع أكبر من إجمالي الطلب');let {data:prev,error:pe}=await sb.from('orders').select('order_number').order('order_number',{ascending:false}).limit(1);if(pe)throw pe;let no=(Number(prev?.[0]?.order_number)||1000)+1;let oid=uuid();let {error:oe}=await sb.from('orders').insert({id:oid,order_number:no,customer_id:cust.id,status:f.get('status'),total_amount:total,discount,notes:String(f.get('note')||''),created_by:currentUser.id});if(oe)throw oe;let rows=items.map(x=>({id:uuid(),order_id:oid,service_id:x.serviceId,item_name:x.garment,quantity:x.qty,unit_price:x.price,subtotal:x.qty*x.price}));let {error:ie}=await sb.from('order_items').insert(rows);if(ie)throw ie;if(paid>0){let {error:payerr}=await sb.from('payments').insert({id:uuid(),order_id:oid,amount:paid,payment_method:'cash',notes:'دفعة عند تسجيل الطلب',received_by:currentUser.id});if(payerr)throw payerr}await refreshData();closeModal();render();let created=db.orders.find(x=>x.id===oid);if(created)setTimeout(()=>printOrder(oid),100);
 }catch(err){notifyError(err)}finally{busy=false}}

function openExpense(){showModal('تسجيل مصروف',`<form onsubmit="saveExpense(event)"><div class="form-grid"><div class="field"><label>بند المصروف</label><select name="category"><option>إيجار</option><option>رواتب وأجور</option><option>كهرباء ومياه</option><option>منظفات ومواد تشغيل</option><option>صيانة</option><option>نقل ومواصلات</option><option>أخرى</option></select></div><div class="field"><label>المبلغ (ريال يمني)</label><input name="amount" type="number" min="1" required></div><div class="field"><label>التاريخ</label><input name="date" type="date" value="${today()}" required></div><div class="field wide"><label>البيان / ملاحظات</label><textarea name="note"></textarea></div></div><div class="modal-actions"><button class="btn primary">حفظ المصروف</button></div></form>`)}
async function saveExpense(e){e.preventDefault();let f=new FormData(e.target);try{let {error}=await sb.from('expenses').insert({id:uuid(),description:f.get('note')||f.get('category'),amount:Number(f.get('amount')),category:f.get('category'),expense_date:f.get('date'),created_by:currentUser.id});if(error)throw error;await refreshData();closeModal();render()}catch(err){notifyError(err)}}
function openService(sid){if(role!=='manager')return;let s=db.services.find(x=>x.id===sid)||{name:'',price:''};showModal(sid?'تعديل الخدمة':'إضافة خدمة',`<form onsubmit="saveService(event,'${sid||''}')"><div class="form-grid"><div class="field"><label>اسم الخدمة</label><input name="name" value="${esc(s.name)}" required></div><div class="field"><label>السعر الافتراضي</label><input name="price" type="number" min="0" value="${s.price}" required></div></div><div class="modal-actions"><button class="btn primary">حفظ</button></div></form>`)}
async function saveService(e,sid){e.preventDefault();let f=new FormData(e.target);try{let payload={name:f.get('name'),price:Number(f.get('price')),active:true};let result=sid?await sb.from('services').update(payload).eq('id',sid):await sb.from('services').insert({id:uuid(),...payload});if(result.error)throw result.error;await refreshData();closeModal();render()}catch(err){notifyError(err)}}
function changeStatus(oid){let o=db.orders.find(x=>x.id===oid);showModal('تحديث حالة الطلب',`<div class="field"><label>الطلب رقم ${esc(o.no)}</label><select id="newStatus">${Object.entries(statusText).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="modal-actions"><button class="btn primary" onclick="saveStatus('${oid}')">حفظ الحالة</button></div>`)}

function printOrder(oid){let o=db.orders.find(x=>x.id===oid);if(!o)return;let items=o.items||[];let w=window.open('','_blank','width=430,height=700');if(!w){alert('اسمح بفتح النوافذ المنبثقة لطباعة الفاتورة');return}w.document.write(`<html lang="ar" dir="rtl"><meta charset="utf-8"><title>فاتورة ${esc(o.no)}</title><style>body{font-family:Tahoma,Arial;padding:22px;color:#18313b}h2{text-align:center;margin:5px}p{text-align:center;color:#555;font-size:12px}.line{border-top:1px dashed #888;margin:15px 0}table{width:100%;border-collapse:collapse}th,td{padding:8px 3px;border-bottom:1px solid #ddd;font-size:12px;text-align:right}.right{text-align:left;font-weight:bold}.total{font-size:17px;font-weight:bold}.foot{text-align:center;font-size:11px;margin-top:25px}</style><h2>${esc(db.settings.shop)}</h2><p>${esc(db.settings.address)}<br>${esc(db.settings.phone)}</p><div class="line"></div><b>فاتورة رقم: ${esc(o.no)}</b><p>التاريخ: ${o.date}</p><p style="text-align:right">العميل: ${esc(o.customer)}<br>الهاتف: ${esc(o.phone)}</p><div class="line"></div><table><tr><th>الخدمة</th><th>الصنف</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr>${items.map(x=>`<tr><td>${esc(x.service)}</td><td>${esc(x.garment)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.total)}</td></tr>`).join('')}<tr><td colspan="4"><b>إجمالي الطلب</b></td><td class="right total">${money(o.total)}</td></tr><tr><td colspan="4">المدفوع</td><td class="right">${money(o.paid)}</td></tr><tr><td colspan="4">المتبقي</td><td class="right">${money(due(o))}</td></tr></table><p class="foot">شكراً لثقتكم بنا – جودة أعلى، تكاليف أقل، وراحة بال</p><script>window.onload=()=>window.print()<\/script></html>`);w.document.close()}

function exportData(){let rows=[['رقم الطلب','العميل','التاريخ','الأصناف','الإجمالي','المدفوع','المتبقي','الحالة'],...db.orders.map(o=>[o.no,o.customer,o.date,o.garment,o.total,o.paid,due(o),statusText[o.status]])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'full-clean-orders.csv')}
